name: Deploy ProxyHarvest Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/proxyharvest-gateway.js'
      - '.github/workflows/deploy-cloudflare-worker.yml'

permissions:
  contents: read

concurrency:
  group: proxyharvest-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate current gateway source
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/proxyharvest-gateway.js
          grep -Fq "cloudflare:sockets" worker/proxyharvest-gateway.js
          grep -Fq "ProxyHarvest Worker Gateway v42" worker/proxyharvest-gateway.js
          grep -Fq "streaming-cors-relay" worker/proxyharvest-gateway.js
          grep -Fq "'/source-check'" worker/proxyharvest-gateway.js
          grep -Fq "'/bridge/health'" worker/proxyharvest-gateway.js
          grep -Fq "'/ai/health'" worker/proxyharvest-gateway.js
          grep -Fq "'/ai/advise'" worker/proxyharvest-gateway.js
          grep -Fq "https://router.huggingface.co/v1/chat/completions" worker/proxyharvest-gateway.js
          grep -Fq "Qwen/Qwen3-4B-Instruct-2507:fastest" worker/proxyharvest-gateway.js
          grep -Fq "raw-tcp-tls" worker/proxyharvest-gateway.js
          grep -Fq "verifier:false" worker/proxyharvest-gateway.js
          grep -Fq "A repair is never verification" worker/proxyharvest-gateway.js
          if grep -Fq "ALLOWED_HOSTS" worker/proxyharvest-gateway.js; then
            echo "Legacy fixed allowlist detected; refusing deployment."
            exit 1
          fi
          echo 'PASS: v42 gateway + Qwen3 HF repair-advisor source contract.'

      - name: Require Cloudflare and Hugging Face secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.cluadflairapi }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.huggingfacetoken }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Cloudflare token missing (CLOUDFLARE_API_TOKEN/cluadflairapi).'; exit 2; }
          test -n "${HF_TOKEN:-}" || { echo 'Hugging Face token missing (HF_TOKEN/huggingfacetoken).'; exit 2; }
          echo 'PASS: required deployment secrets are present.'

      - name: Deploy proxyharvest-gateway
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.cluadflairapi }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then EXTRA+=(--account-id "$CLOUDFLARE_ACCOUNT_ID"); fi
          npx --yes wrangler@latest deploy worker/proxyharvest-gateway.js --name proxyharvest-gateway --compatibility-date 2026-09-05 "${EXTRA[@]}"

      - name: Configure HF_TOKEN as Worker secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.cluadflairapi }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.huggingfacetoken }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then EXTRA+=(--account-id "$CLOUDFLARE_ACCOUNT_ID"); fi
          printf '%s' "$HF_TOKEN" | npx --yes wrangler@latest secret put HF_TOKEN --name proxyharvest-gateway "${EXTRA[@]}"
          echo 'PASS: HF_TOKEN stored as Cloudflare Worker secret.'

      - name: Verify live Worker, relay and Qwen3 HF advisor
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://proxyharvest-gateway.amin-chinisaz-edu.workers.dev'
          for attempt in 1 2 3 4 5 6; do
            BODY="$(curl -fsS --max-time 15 "$BASE/health" || true)"
            echo "$BODY"
            if printf '%s' "$BODY" | grep -Fq 'ProxyHarvest Worker Gateway v42' \
              && printf '%s' "$BODY" | grep -Fq 'streaming-cors-relay' \
              && printf '%s' "$BODY" | grep -Fq 'raw-tcp-tls' \
              && printf '%s' "$BODY" | grep -Fq '"configured":true' \
              && printf '%s' "$BODY" | grep -Fq 'Qwen/Qwen3-4B-Instruct-2507:fastest'; then break; fi
            [ "$attempt" -lt 6 ] || { echo 'Live Worker did not report expected v42/Qwen3/HF-secret health.'; exit 1; }
            sleep 5
          done

          EDGE="$(curl -fsS --max-time 15 "$BASE/bridge/health")"
          echo "$EDGE"
          printf '%s' "$EDGE" | grep -Fq '"kind":"cloud-edge-relay"'
          printf '%s' "$EDGE" | grep -Fq '"verifier":false'

          TEST_URL='https://raw.githubusercontent.com/free-nodes/v2rayfree/main/README.md'
          ENCODED="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("'"$TEST_URL"'", safe=""))')"
          CHECK="$(curl -fsS --max-time 20 "$BASE/source-check?url=$ENCODED")"
          echo "$CHECK"
          printf '%s' "$CHECK" | grep -Fq '"ok":true'

          RAW_FILE="$(mktemp)"
          curl -fsS --max-time 20 "$BASE/?url=$ENCODED" -o "$RAW_FILE"
          test -s "$RAW_FILE"

          AI="$(curl -fsS --max-time 45 "$BASE/ai/health?deep=1")"
          echo "$AI"
          printf '%s' "$AI" | grep -Fq '"mode":"huggingface-provider"'
          printf '%s' "$AI" | grep -Fq '"loaded":true'
          printf '%s' "$AI" | grep -Fq 'Qwen/Qwen3-4B-Instruct-2507:fastest'

          ADVICE="$(curl -fsS --max-time 45 -X POST -H 'Content-Type: application/json' --data '{"items":[{"index":0,"issues":["sni"],"type":"vless","candidates":[{"id":"candidate-a","summary":"bounded reversible candidate","rule_confidence":72}]}]}' "$BASE/ai/advise")"
          echo "$ADVICE"
          printf '%s' "$ADVICE" | grep -Fq '"ok":true'
          printf '%s' "$ADVICE" | grep -Fq '"verification":false'
          printf '%s' "$ADVICE" | grep -Fq 'candidate-a'
          echo 'PASS: live v42 Worker + relay + source health + Cloud Edge Relay + Qwen3 HF repair advisor.'
