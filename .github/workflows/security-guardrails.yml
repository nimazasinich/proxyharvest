name: ProxyHarvest Security Guardrails

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block unsafe auto-materialization paths
        shell: bash
        run: |
          set -euo pipefail

          fail=0

          if [ -f .github/workflows/materialize-v25.1.yml ]; then
            echo "::error::.github/workflows/materialize-v25.1.yml is blocked. Do not auto-materialize deployment payloads from CI."
            fail=1
          fi

          blocked_artifacts="$({ find deploy -type f \( \
            -path 'deploy/v25.1*' -o \
            -path 'deploy/*/chunks/*' -o \
            -path 'deploy/*/xz*/*' -o \
            -path 'deploy/*/transfer/*' \
          \) 2>/dev/null || true; } | sort)"

          if [ -n "$blocked_artifacts" ]; then
            echo "::error::Staged chunked deployment artifacts are blocked. Commit explicit runtime source files instead."
            printf '%s\n' "$blocked_artifacts"
            fail=1
          fi

          # Scan workflow files other than this guardrail file, so the blocked-pattern
          # strings documented here do not create a self-match false positive.
          unsafe_workflows="$({ grep -RInE 'curl -fsSL .*vercel\.app|contents:[[:space:]]*write|git push origin HEAD' .github/workflows \
            --exclude='security-guardrails.yml' 2>/dev/null || true; } | sort)"

          if [ -n "$unsafe_workflows" ]; then
            echo "::error::Unsafe workflow pattern detected: external preview hydration, contents:write, or CI push."
            printf '%s\n' "$unsafe_workflows"
            fail=1
          fi

          exit "$fail"
