name: Fix and Verify ProxyHarvest Runtime Stability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-runtime-stability-v39.mjs'
      - 'scripts/apply_runtime_stability_v39.py'
      - 'scripts/apply_mutation_loop_v40.py'
      - 'scripts/apply_status_sync_v40.py'
      - 'scripts/apply_v34_mutation_v40.py'
      - 'scripts/apply_v38_state_v40.py'
      - 'scripts/runtime-stability-check.mjs'
      - 'scripts/mutation_writer_harness.mjs'
      - 'scripts/mutation_observer_harness.mjs'
      - 'scripts/browser_stability_smoke.mjs'
      - '.github/workflows/runtime-stability-v39.yml'

permissions:
  contents: write

concurrency:
  group: proxyharvest-runtime-stability-main
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply runtime stability patches
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-runtime-stability-v39.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_mutation_loop_v40.py')
          s = p.read_text(encoding='utf-8')
          old = '    return rx.sub(replacement, text, count=1)'
          new = '    return rx.sub(lambda _m: replacement, text, count=1)'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
          python3 scripts/apply_mutation_loop_v40.py
          python3 scripts/apply_status_sync_v40.py
          python3 scripts/apply_v34_mutation_v40.py
          python3 scripts/apply_v38_state_v40.py

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax and static stability gates
        run: |
          npm run check
          node scripts/runtime-stability-check.mjs
          node --check patches/ui-v26.js
          node --check patches/auto-pipeline-v27.js
          node --check patches/status-sync-v32.js
          node --check patches/compact-interaction-v34.js
          node --check patches/runtime-smart-v38.js
          node --check proxyharvest.js
          grep -Fq "PH_MUTATION_STABILITY_V40 = '40.0.0'" proxyharvest.js
          grep -Fq "PH_V26_MUTATION_STABILITY = '40.0.0'" patches/ui-v26.js
          grep -Fq "PH_V27_MUTATION_STABILITY = '40.0.0'" patches/auto-pipeline-v27.js
          grep -Fq "PH_V32_MUTATION_STABILITY = '40.0.0'" patches/status-sync-v32.js
          grep -Fq "PH_V34_MUTATION_STABILITY = '40.0.2'" patches/compact-interaction-v34.js
          grep -Fq "implicitStopIssued" patches/compact-interaction-v34.js
          grep -Fq "syncFetchingState();" patches/compact-interaction-v34.js
          grep -Fq "guardUnexpectedTesting();" patches/compact-interaction-v34.js
          grep -Fq "PH_V38_STATE_STABILITY = '40.0.0'" patches/runtime-smart-v38.js
          grep -Fq "runtimeState()?.configs" patches/runtime-smart-v38.js

      - name: Build canonical output
        run: npm run build

      - name: Instrumented jsdom mutation writer trace
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0 fake-indexeddb@6.0.1
          timeout 30s node scripts/mutation_writer_harness.mjs

      - name: Instrumented jsdom MutationObserver harness
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s node scripts/mutation_observer_harness.mjs

      - name: Headless browser event-loop smoke
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund puppeteer-core@24.16.0
          python3 -m http.server 4173 --directory public >/tmp/proxyharvest-http.log 2>&1 &
          HTTP_PID=$!
          cleanup() { kill "$HTTP_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo 'Chrome/Chromium not found on runner'; exit 1; }
          PH_CHROME_PATH="$CHROME" timeout 30s node scripts/browser_stability_smoke.mjs

      - name: Commit verified runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "proxyharvest-runtime-stability-bot"
          git add proxyharvest.js patches/ui-v26.js patches/runtime-smart-v38.js patches/status-sync-v32.js patches/auto-pipeline-v27.js patches/compact-interaction-v34.js patches/configs-density-v35.js patches/configs-row-v36.js patches/status-guard-v32.js scripts/apply_mutation_loop_v40.py scripts/apply_status_sync_v40.py scripts/apply_v34_mutation_v40.py scripts/apply_v38_state_v40.py scripts/build.mjs package.json
          if git diff --cached --quiet; then
            echo 'Runtime stability fix already applied.'
            exit 0
          fi
          git commit -m "fix: eliminate remaining MutationObserver feedback loops"
          git push origin HEAD:main
