name: Fix and Verify ProxyHarvest Runtime Stability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-runtime-stability-v39.mjs'
      - 'scripts/apply_runtime_stability_v39.py'
      - 'scripts/runtime-stability-check.mjs'
      - 'scripts/browser_stability_smoke.mjs'
      - '.github/workflows/runtime-stability-v39.yml'

permissions:
  contents: write

concurrency:
  group: proxyharvest-runtime-stability-main
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply runtime stability patch
        run: node scripts/apply-runtime-stability-v39.mjs

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax and static stability gates
        run: |
          npm run check
          node scripts/runtime-stability-check.mjs

      - name: Build canonical output
        run: npm run build

      - name: Headless browser event-loop smoke
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund puppeteer-core@24.16.0
          python3 -m http.server 4173 --directory public >/tmp/proxyharvest-http.log 2>&1 &
          HTTP_PID=$!
          cleanup() { kill "$HTTP_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo 'Chrome/Chromium not found on runner'; exit 1; }
          PH_CHROME_PATH="$CHROME" timeout 30s node scripts/browser_stability_smoke.mjs

      - name: Commit verified runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "proxyharvest-runtime-stability-bot"
          git add patches/runtime-smart-v38.js patches/status-sync-v32.js patches/auto-pipeline-v27.js patches/compact-interaction-v34.js patches/configs-density-v35.js patches/configs-row-v36.js patches/status-guard-v32.js scripts/build.mjs package.json .github/workflows/v38-runtime.yml
          if git diff --cached --quiet; then
            echo 'Runtime stability fix already applied.'
            exit 0
          fi
          git commit -m "fix: eliminate runtime mutation loops and UI hangs"
          git pull --rebase origin main
          git push origin HEAD:main
