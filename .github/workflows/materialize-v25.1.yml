name: Materialize ProxyHarvest V25.1
on:
  push:
    branches:
      - main
    paths:
      - 'deploy/v25.1/READY'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize V25.1 runtime from verified xz8 artifact
        run: |
          set -euo pipefail
          bash deploy/v25.1/reconstruct.sh
      - name: Commit materialized runtime
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: materialize ProxyHarvest V25.1 FetchComplete' || true
          git push origin HEAD:main
