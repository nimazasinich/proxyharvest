name: Materialize ProxyHarvest V25.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'package.json'
      - 'vercel.json'
      - '.vercelignore'
      - 'static/**'
      - 'api/**'
      - 'worker/**'
      - '.github/workflows/materialize-v25.1.yml'

permissions:
  contents: read

concurrency:
  group: proxyharvest-v25-vercel-source
  cancel-in-progress: true

jobs:
  validate-vercel-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block Python/Torch Vercel path
        shell: bash
        run: |
          set -euo pipefail
          test ! -f requirements.txt
          test ! -f app.py
          test ! -f deploy_space.py
          test -f package.json
          test -f .vercelignore
          grep -Fq 'requirements.txt' .vercelignore
          echo 'PASS python-torch-block'

      - name: Validate V15 NetworkCanonical parity source
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html vercel.json static/app.js static/ui.js static/engine.js static/v15-compat.js static/styles.css static/repair.js api/ai/health.js api/ai/advise.js worker/proxyharvest-gateway.js; do
            test -f "$f" || { echo "MISSING FILE: $f"; exit 1; }
            echo "FOUND FILE: $f"
          done
          check_marker() {
            file="$1"; marker="$2"
            if grep -Fq -- "$marker" "$file"; then
              echo "MARKER OK: $file :: $marker"
            else
              echo "MARKER MISSING: $file :: $marker"
              exit 1
            fi
          }
          check_marker index.html 'ProxyHarvest'
          check_marker index.html '/static/app.js'
          check_marker vercel.json 'buildCommand'
          check_marker vercel.json 'outputDirectory'
          check_marker static/app.js 'bootV15Compatibility'
          check_marker static/ui.js 'V15 NetworkCanonical parity'
          check_marker static/v15-compat.js 'Real Verify Top 100'
          check_marker static/v15-compat.js 'Export Working 100'
          check_marker static/v15-compat.js 'Export Reachable'
          check_marker static/v15-compat.js 'Export Verified Live'
          check_marker static/engine.js 'workerReachable'
          check_marker static/engine.js 'bridgeReachable'
          check_marker static/engine.js 'protocolVerified'
          check_marker static/engine.js 'tunnelVerified'
          check_marker static/repair.js '/api/ai/advise'
          echo 'PASS v15-parity-source'

      - name: Validate JavaScript and Vercel-equivalent build
        shell: bash
        run: |
          set -euo pipefail
          for f in static/*.js api/ai/*.js worker/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
          npm run build
          test -f public/index.html
          test -f public/static/app.js
          test -f public/static/v15-compat.js
          grep -Fq 'Real Verify Top 100' public/static/v15-compat.js
          echo 'PASS npm-build'

      - name: Safety semantics gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'cfg.live = isReachable' static/v15-compat.js; then
            echo 'FAIL: worker reachability must never become live/verified'
            exit 1
          fi
          grep -Fq 'cfg.live = cfg.probe.protocolVerified || cfg.probe.tunnelVerified ? true : null' static/v15-compat.js
          echo 'PASS truthful-verification'

      - name: Vercel redeploy note
        run: |
          echo "GitHub main is Vercel-ready. Python/Torch is blocked; Worker reachability remains separate from protocol/tunnel verification; Real Test Bridge is the verification path."
