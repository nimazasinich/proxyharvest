name: Materialize ProxyHarvest V25.1
on:
  push:
    branches:
      - main
      - deploy/v25.1-fetchcomplete
    paths:
      - 'deploy/v25.1-xz/READY'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize verified V25.1 xz runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^status=ready$' deploy/v25.1-xz/READY
          bash deploy/v25.1-xz/reconstruct.sh
          grep -R "FETCH / HARVEST\|FETCH ALL ENABLED\|Fetch & Harvest" index.html proxyharvest.html proxyharvest.js
          grep -R "forceRefresh" index.html proxyharvest.html proxyharvest.js
          grep -R "verifyAllSources" index.html proxyharvest.html proxyharvest.js
          grep -R "WireGuard" index.html proxyharvest.html proxyharvest.js
      - name: Commit materialized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit'
            exit 0
          fi
          git commit -m 'release: materialize ProxyHarvest V25.1 FetchComplete'
          git push origin HEAD:${GITHUB_REF_NAME}
