name: Materialize ProxyHarvest V25.1
on:
  push:
    branches:
      - main
      - deploy/v25.1-fetchcomplete
    paths:
      - 'deploy/v25.1/READY'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize V25.1 runtime
        run: |
          set -euo pipefail
          if [ -f deploy/v25.1/reconstruct.sh ] && bash deploy/v25.1/reconstruct.sh; then
            echo "chunked artifact reconstructed"
          else
            echo "chunked artifact unavailable; using fresh Vercel runtime export with marker verification"
            BASE="${PROXYHARVEST_V25_1_RUNTIME_URL:-https://proxyharvest-d4icfujr6-dreammakers-projects-6bd02e6d.vercel.app}"
            rm -rf static app.py deploy_space.py requirements.txt
            curl -fsSL "$BASE/" -o index.html
            curl -fsSL "$BASE/proxyharvest.html" -o proxyharvest.html || cp index.html proxyharvest.html
            curl -fsSL "$BASE/proxyharvest.js" -o proxyharvest.js
            curl -fsSL "$BASE/vercel.json" -o vercel.json || cat > vercel.json <<'JSON'
          {"cleanUrls":true,"headers":[{"source":"/(.*)","headers":[{"key":"X-Content-Type-Options","value":"nosniff"},{"key":"Referrer-Policy","value":"no-referrer"}]}]}
          JSON
            mkdir -p api
            curl -fsSL "$BASE/api/hf-advisor.js" -o api/hf-advisor.js || cat > api/hf-advisor.js <<'JS'
          export default async function handler(req, res) { res.status(503).json({ ok:false, error:'HF advisor not bundled in fallback fetch' }); }
          JS
            grep -R "ProxyHarvest" index.html proxyharvest.html proxyharvest.js
            grep -R "forceRefresh" proxyharvest.js
            grep -R "verifyAllSources" proxyharvest.js
            grep -R "WireGuard" proxyharvest.js
          fi
      - name: Commit materialized runtime
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: materialize ProxyHarvest V25.1 FetchComplete' || true
          git push origin HEAD:${GITHUB_REF_NAME}
