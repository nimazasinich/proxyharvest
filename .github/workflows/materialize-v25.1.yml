name: Materialize ProxyHarvest V25.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'vercel.json'
      - 'static/**'
      - '.github/workflows/materialize-v25.1.yml'

permissions:
  contents: read

concurrency:
  group: proxyharvest-v25-vercel-source
  cancel-in-progress: true

jobs:
  validate-vercel-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Vercel entrypoints
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f vercel.json
          test -f static/index.html
          test -f static/app.js
          test -f static/styles.css
          grep -q 'ProxyHarvest' index.html
          grep -q '/static/app.js' index.html
          grep -q 'rewrites' vercel.json

      - name: Validate JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          for f in static/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Vercel redeploy note
        run: |
          echo "GitHub source is Vercel-ready. Redeploy from Vercel/Git integration; this workflow does not mutate files or fetch from Vercel preview URLs."
