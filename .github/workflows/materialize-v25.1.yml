name: Materialize ProxyHarvest V25.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'package.json'
      - 'vercel.json'
      - '.vercelignore'
      - 'static/**'
      - 'api/**'
      - 'worker/**'
      - '.github/workflows/materialize-v25.1.yml'

permissions:
  contents: read

concurrency:
  group: proxyharvest-v25-vercel-source
  cancel-in-progress: true

jobs:
  validate-vercel-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block Python/Torch Vercel path
        shell: bash
        run: |
          set -euo pipefail
          test ! -f requirements.txt
          test ! -f app.py
          test ! -f deploy_space.py
          test -f package.json
          test -f .vercelignore
          grep -q 'requirements.txt' .vercelignore

      - name: Validate Vercel entrypoints
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f vercel.json
          test -f static/index.html
          test -f static/app.js
          test -f static/v15-compat.js
          test -f static/styles.css
          test -f api/ai/health.js
          test -f api/ai/advise.js
          test -f worker/proxyharvest-gateway.js
          grep -q 'ProxyHarvest' index.html
          grep -q '/static/app.js' index.html
          grep -q 'buildCommand' vercel.json
          grep -q 'outputDirectory' vercel.json
          grep -q 'bootV15Compatibility' static/app.js
          grep -q 'Export Working 100' static/v15-compat.js
          grep -q '/api/ai/advise' static/repair.js

      - name: Run Vercel-equivalent build
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f public/index.html
          test -f public/static/app.js
          test -f public/static/v15-compat.js

      - name: Vercel redeploy note
        run: |
          echo "GitHub main is Vercel-ready. Python/Torch files are blocked; npm run build validates UI, export, ping/probe, AI API, and Worker source."
