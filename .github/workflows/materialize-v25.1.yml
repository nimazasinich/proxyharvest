name: Materialize ProxyHarvest V25.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'package.json'
      - 'vercel.json'
      - '.vercelignore'
      - 'static/**'
      - 'api/**'
      - 'worker/**'
      - '.github/workflows/materialize-v25.1.yml'

permissions:
  contents: read

concurrency:
  group: proxyharvest-v25-vercel-source
  cancel-in-progress: true

jobs:
  validate-vercel-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block Python/Torch Vercel path
        shell: bash
        run: |
          set -euo pipefail
          test ! -f requirements.txt
          test ! -f app.py
          test ! -f deploy_space.py
          test -f package.json
          test -f .vercelignore
          grep -Fq 'requirements.txt' .vercelignore
          echo 'PASS python-torch-block'

      - name: Validate V15 NetworkCanonical parity source
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html vercel.json static/app.js static/ui.js static/engine.js static/v15-compat.js static/styles.css static/repair.js api/ai/health.js api/ai/advise.js worker/proxyharvest-gateway.js; do
            test -f "$f" || { echo "MISSING $f"; exit 1; }
            echo "FOUND $f"
          done
          grep -Fq 'ProxyHarvest' index.html
          grep -Fq '/static/app.js' index.html
          grep -Fq 'buildCommand' vercel.json
          grep -Fq 'outputDirectory' vercel.json
          grep -Fq 'bootV15Compatibility' static/app.js
          grep -Fq 'V15 NetworkCanonical parity' static/ui.js
          grep -Fq 'Real Verify Top 100' static/v15-compat.js
          grep -Fq 'Export Working 100' static/v15-compat.js
          grep -Fq 'Export Reachable' static/v15-compat.js
          grep -Fq 'Export Verified Live' static/v15-compat.js
          grep -Fq 'workerReachable' static/engine.js
          grep -Fq 'bridgeReachable' static/engine.js
          grep -Fq 'protocolVerified' static/engine.js
          grep -Fq 'tunnelVerified' static/engine.js
          grep -Fq '/api/ai/advise' static/repair.js
          echo 'PASS v15-parity-source'

      - name: Validate JavaScript and Vercel-equivalent build
        shell: bash
        run: |
          set -euo pipefail
          for f in static/*.js api/ai/*.js worker/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
          npm run build
          test -f public/index.html
          test -f public/static/app.js
          test -f public/static/v15-compat.js
          grep -Fq 'Real Verify Top 100' public/static/v15-compat.js
          echo 'PASS npm-build'

      - name: Safety semantics gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'cfg.live = isReachable' static/v15-compat.js; then
            echo 'FAIL: worker reachability must never become live/verified'
            exit 1
          fi
          grep -Fq "cfg.live = cfg.probe.protocolVerified || cfg.probe.tunnelVerified ? true : null" static/v15-compat.js
          echo 'PASS truthful-verification'

      - name: Vercel redeploy note
        run: |
          echo "GitHub main is Vercel-ready. Python/Torch is blocked; Worker reachability remains separate from protocol/tunnel verification; Real Test Bridge is the verification path."
