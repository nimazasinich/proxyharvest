name: Validate ProxyHarvest GitHub Main

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/v26-ui-runtime
      - integration/v27-auto-pipeline
    paths:
      - 'index.html'
      - 'proxyharvest.html'
      - 'proxyharvest.js'
      - 'package.json'
      - 'vercel.json'
      - '.vercelignore'
      - 'patches/**'
      - 'scripts/**'
      - 'api/**'
      - 'worker/**'
      - '.github/workflows/materialize-v25.1.yml'

permissions:
  contents: read

concurrency:
  group: proxyharvest-github-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-github-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep Vercel source Node-only
        shell: bash
        run: |
          set -euo pipefail
          test ! -f requirements.txt
          test ! -f app.py
          test ! -f deploy_space.py
          test -f .vercelignore
          grep -Fq 'requirements.txt' .vercelignore
          echo 'PASS node-only-deploy-source'

      - name: Validate canonical fullstack pair
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html proxyharvest.html proxyharvest.js package.json vercel.json patches/ui-v26.js patches/ui-v26.css patches/auto-pipeline-v27.js patches/auto-pipeline-v27.css patches/layout-v28.css patches/layout-v31-1368.css patches/status-sync-v32.js patches/status-sync-v32.css patches/status-guard-v32.js patches/compact-interaction-v34.js patches/compact-contrast-v34.css patches/configs-density-v35.js patches/configs-density-v35.css patches/configs-row-v36.js patches/configs-row-v36.css scripts/build.mjs api/ai/health.js api/ai/advise.js worker/proxyharvest-gateway.js; do
            test -f "$f" || { echo "MISSING FILE: $f"; exit 1; }
            echo "FOUND FILE: $f"
          done
          grep -Fq 'PROXYHARVEST_EXPECTED_BUILD="25.0.0-original-fullstack"' index.html
          grep -Fq "PROXYHARVEST_BUILD = '25.0.0-original-fullstack'" proxyharvest.js
          cmp -s index.html proxyharvest.html
          grep -Fq 'Best Config Export' patches/ui-v26.js
          grep -Fq 'Real Verify' patches/ui-v26.js
          grep -Fq '/api/ai/health' patches/ui-v26.js
          grep -Fq '/api/ai/advise' patches/ui-v26.js
          grep -Fq 'Worker/browser reachability never becomes a WireGuard handshake' patches/ui-v26.js
          echo 'PASS canonical-pair-and-v26-patch'

      - name: Validate autonomous pipeline contract
        shell: bash
        run: |
          set -euo pipefail
          node --check patches/auto-pipeline-v27.js
          grep -Fq "const BUILD = '27.0.0-auto-pipeline'" patches/auto-pipeline-v27.js
          grep -Fq 'Fetch → Verify → Score → Rank → Live Summary' patches/auto-pipeline-v27.js
          grep -Fq 'strictRealPing: true' patches/auto-pipeline-v27.js
          grep -Fq 'strictRealPing: false' patches/auto-pipeline-v27.js
          grep -Fq 'Reachability screening complete; no reachable-only result is counted as LIVE' patches/auto-pipeline-v27.js
          grep -Fq 'rescoreAndRank' patches/auto-pipeline-v27.js
          grep -Fq 'qualityRank' patches/auto-pipeline-v27.js
          grep -Fq 'ph:v27-pipeline-complete' patches/auto-pipeline-v27.js
          echo 'PASS autonomous-pipeline-contract'

      - name: Validate canonical 1368x753 layout
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ProxyHarvest V31' patches/layout-v31-1368.css
          grep -Fq -- '--ph-canonical-w:1368px' patches/layout-v31-1368.css
          grep -Fq -- '--ph-canonical-h:753px' patches/layout-v31-1368.css
          grep -Fq 'overflow:hidden!important' patches/layout-v31-1368.css
          grep -Fq 'data-proxyharvest-layout="v31-1368x753"' scripts/build.mjs
          echo 'PASS V31-canonical-1368x753-layout'

      - name: Validate V32 verification and export contract
        shell: bash
        run: |
          set -euo pipefail
          node --check patches/status-sync-v32.js
          node --check patches/status-guard-v32.js
          grep -Fq "const BUILD = '32.0.0-verification-sync'" patches/status-sync-v32.js
          grep -Fq "p.tunnelVerified === true || p.protocolVerified === true" patches/status-sync-v32.js
          grep -Fq "return 'reachable'" patches/status-sync-v32.js
          grep -Fq "real-ping-unavailable" patches/status-sync-v32.js
          grep -Fq 'bestVerified' patches/status-sync-v32.js
          grep -Fq 'exportBestVerified' patches/status-sync-v32.js
          grep -Fq 'ph:v32-verification-sync' patches/status-sync-v32.js
          grep -Fq 'PROXYHARVEST_V32' patches/status-guard-v32.js
          echo 'PASS V32-verification-export-dashboard-sync'

      - name: Validate V34 compact UI and explicit-run guard
        shell: bash
        run: |
          set -euo pipefail
          node --check patches/compact-interaction-v34.js
          grep -Fq "const BUILD = '34.0.0-compact-interaction'" patches/compact-interaction-v34.js
          grep -Fq "setAutoEnabled(false)" patches/compact-interaction-v34.js
          grep -Fq 'e.isTrusted' patches/compact-interaction-v34.js
          grep -Fq 'guardUnexpectedTesting' patches/compact-interaction-v34.js
          grep -Fq 'ProxyHarvest V34' patches/compact-contrast-v34.css
          grep -Fq 'data-proxyharvest-compact="v34"' scripts/build.mjs
          echo 'PASS V34-compact-explicit-run-contract'

      - name: Validate V35 dense configs layout
        shell: bash
        run: |
          set -euo pipefail
          node --check patches/configs-density-v35.js
          grep -Fq "const BUILD = '35.0.0-configs-density'" patches/configs-density-v35.js
          grep -Fq "['Worker Reachable', ['Reachable'" patches/configs-density-v35.js
          grep -Fq '#tab-configs .ph-status-overview' patches/configs-density-v35.css
          grep -Fq 'table-layout:fixed!important' patches/configs-density-v35.css
          grep -Fq 'height:38px!important' patches/configs-density-v35.css
          grep -Fq 'data-proxyharvest-configs-density="v35"' scripts/build.mjs
          grep -Fq "configsDensity: '35.0.0-configs-density'" scripts/build.mjs
          echo 'PASS V35-dense-justified-configs'

      - name: Validate V36 single-line rows and native scrollbars
        shell: bash
        run: |
          set -euo pipefail
          node --check patches/configs-row-v36.js
          grep -Fq "const BUILD = '36.0.0-single-line-rows'" patches/configs-row-v36.js
          grep -Fq "low.includes('worker reachable')" patches/configs-row-v36.js
          grep -Fq "return ['Reachable'" patches/configs-row-v36.js
          grep -Fq 'ProxyHarvest V36' patches/configs-row-v36.css
          grep -Fq 'scrollbar-color:auto!important' patches/configs-row-v36.css
          grep -Fq 'background:revert!important' patches/configs-row-v36.css
          grep -Fq 'display:flex!important' patches/configs-row-v36.css
          grep -Fq 'white-space:nowrap!important' patches/configs-row-v36.css
          grep -Fq 'data-proxyharvest-configs-row="v36"' scripts/build.mjs
          grep -Fq "configsRow: '36.0.0-single-line-rows'" scripts/build.mjs
          echo 'PASS V36-single-line-native-scrollbars'

      - name: Build deploy output
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f public/index.html
          test -f public/proxyharvest.html
          test -f public/proxyharvest.js
          test -f public/patches/configs-density-v35.js
          test -f public/patches/configs-density-v35.css
          test -f public/patches/configs-row-v36.js
          test -f public/patches/configs-row-v36.css
          test -f public/build.json
          grep -Fq 'data-proxyharvest-configs-density="v35"' public/index.html
          grep -Fq 'data-proxyharvest-configs-row="v36"' public/index.html
          grep -Fq 'patches/configs-row-v36.js' public/index.html
          grep -Fq 'patches/configs-row-v36.css' public/index.html
          grep -Fq '"configsDensity": "35.0.0-configs-density"' public/build.json
          grep -Fq '"configsRow": "36.0.0-single-line-rows"' public/build.json
          echo 'PASS deploy-output'

      - name: Truthful verification safety gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'probeToLegacyLive' proxyharvest.js
          grep -Fq 'protocolVerified' proxyharvest.js
          grep -Fq 'tunnelVerified' proxyharvest.js
          grep -Fq 'browser fallback does not prove proxy protocol/tunnel' proxyharvest.js
          grep -Fq 'REACHABLE is never promoted to VERIFIED' patches/ui-v26.js
          grep -Fq 'Verified only' patches/ui-v26.js
          grep -Fq 'no reachable-only result is counted as LIVE' patches/auto-pipeline-v27.js
          grep -Fq "setAutoEnabled(false)" patches/compact-interaction-v34.js
          echo 'PASS truthful-verification'

      - name: Summary
        run: |
          echo "GitHub main is canonical: attachment UI/runtime + V26 UI + V27 pipeline + V31 responsive dashboard + V32 truthful verification + V34 explicit-run guard + V35 dense Configs + V36 single-line rows/native scrollbars + AI API + Worker source."
