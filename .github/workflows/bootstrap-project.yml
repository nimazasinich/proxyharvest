name: Bootstrap ProxyHarvest project

on:
  push:
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/part00
          test -f bootstrap/part01
          test -f bootstrap/part02
          test -f bootstrap/part03
          test -f bootstrap/part04
          cat bootstrap/part00 bootstrap/part01 bootstrap/part02 bootstrap/part03 bootstrap/part04 > /tmp/project.tgz.b64
          base64 -d /tmp/project.tgz.b64 > /tmp/project.tgz
          echo "066067e70e55419569d41818ee8f831e056c3509483e1fa98a595b1375f5cd1a  /tmp/project.tgz" | sha256sum -c -
          tar -xzf /tmp/project.tgz -C .

      - name: Verify extracted source
        shell: bash
        run: |
          set -euo pipefail
          test -f app.py
          test -f requirements.txt
          test -f static/index.html
          test -f static/app.js
          test -f static/styles.css
          grep -q "uvicorn.run" app.py
          grep -q "Qwen/Qwen2.5-Coder-0.5B-Instruct" app.py
          grep -q "proxyharvest-gateway.amin-chinisaz-edu.workers.dev" static/catalog.js

      - name: Remove bootstrap transport
        shell: bash
        run: |
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-project.yml

      - name: Commit project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: bootstrap ProxyHarvest V18 ZeroGPU application"
          git push
