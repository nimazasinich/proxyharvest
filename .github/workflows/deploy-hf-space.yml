name: Deploy ProxyHarvest to Hugging Face ZeroGPU

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'README.md'
      - 'static/**'
      - 'deploy_space.py'
      - '.github/workflows/deploy-hf-space.yml'

permissions:
  contents: read

concurrency:
  group: proxyharvest-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face deploy client
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<1'

      - name: Validate source before deploy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app.py deploy_space.py
          for f in static/*.js; do node --check "$f"; done
          grep -q 'Qwen/Qwen2.5-Coder-0.5B-Instruct' app.py
          grep -q 'proxyharvest-gateway.amin-chinisaz-edu.workers.dev' static/catalog.js

      - name: Deploy Gradio ZeroGPU Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python deploy_space.py
