name: Sync Hugging Face Provider to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/ai/**'
      - '.github/workflows/sync-vercel-hf.yml'

permissions:
  contents: read

concurrency:
  group: proxyharvest-vercel-hf
  cancel-in-progress: true

jobs:
  sync-vercel-hf:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      VERCEL_PROJECT: proxyharvest
      VERCEL_TEAM_SLUG: dreammakers-projects-6bd02e6d
      DEFAULT_HF_MODEL: Qwen/Qwen2.5-7B-Instruct-1M:fastest
    steps:
      - uses: actions/checkout@v4

      - name: Validate AI provider source
        shell: bash
        run: |
          set -euo pipefail
          node --check api/ai/health.js
          node --check api/ai/advise.js
          grep -Fq 'https://router.huggingface.co/v1/chat/completions' api/ai/health.js
          grep -Fq "mode:'huggingface-provider'" api/ai/health.js

      - name: Detect required secrets
        id: creds
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.Team_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.teamid || vars.teamid || 'team_tgCTfev6a9dYgjXVMHGmvtKl' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.huggingfacetoken }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${VERCEL_TOKEN:-}" ]; then echo 'Team_VERCEL_TOKEN/VERCEL_TOKEN is missing.'; missing=1; fi
          if [ -z "${VERCEL_TEAM_ID:-}" ]; then echo 'teamid is missing.'; missing=1; fi
          if [ -z "${HF_TOKEN:-}" ]; then echo 'HF_TOKEN/huggingfacetoken is missing.'; missing=1; fi
          if [ "$missing" -eq 0 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'PASS: Vercel team token, teamid, and Hugging Face token are present.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 2
          fi

      - name: Resolve Vercel project in team context
        id: project
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.Team_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.teamid || vars.teamid || 'team_tgCTfev6a9dYgjXVMHGmvtKl' }}
        run: |
          set -euo pipefail

          resolved_team_id=''
          team_tmp="$(mktemp)"
          team_code="$(curl -sS -o "$team_tmp" -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/teams?slug=$VERCEL_TEAM_SLUG")"
          echo "Vercel team lookup by slug HTTP $team_code"
          if [[ "$team_code" == 2* ]]; then
            resolved_team_id="$(jq -r '(.teams[0].id // .id // empty)' "$team_tmp")"
            if [ -n "$resolved_team_id" ]; then
              echo "Resolved slug $VERCEL_TEAM_SLUG to team id $resolved_team_id"
            else
              echo 'Team lookup succeeded but returned no team id.'
              jq -c '{teams:(.teams // [])}' "$team_tmp" 2>/dev/null || true
            fi
          else
            jq -c '{error:(.error // .)}' "$team_tmp" 2>/dev/null || cat "$team_tmp"
          fi

          project_id=''
          scope_qs=''
          candidates=("teamId=$VERCEL_TEAM_ID")
          if [ -n "$resolved_team_id" ] && [ "$resolved_team_id" != "$VERCEL_TEAM_ID" ]; then
            candidates+=("teamId=$resolved_team_id")
          fi
          candidates+=("slug=$VERCEL_TEAM_SLUG" '')

          for candidate in "${candidates[@]}"; do
            tmp="$(mktemp)"
            url="https://api.vercel.com/v9/projects/$VERCEL_PROJECT"
            label='unscoped'
            if [ -n "$candidate" ]; then
              url="$url?$candidate"
              label="$candidate"
            fi
            code="$(curl -sS -o "$tmp" -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "$url")"
            echo "Vercel project lookup ($label) HTTP $code"
            if [[ "$code" == 2* ]]; then
              project_id="$(jq -r '(.id // empty)' "$tmp")"
              if [ -n "$project_id" ]; then
                scope_qs="$candidate"
                break
              fi
            else
              jq -c '{error:(.error // .)}' "$tmp" 2>/dev/null || cat "$tmp"
            fi
          done

          if [ -z "$project_id" ]; then
            echo 'Vercel token is accepted, but proxyharvest is not visible through configured teamid, resolved slug team, slug, or unscoped context.'
            exit 1
          fi

          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "scope_qs=$scope_qs" >> "$GITHUB_OUTPUT"
          echo "PASS: team-scoped token can access $VERCEL_PROJECT ($project_id) using ${scope_qs:-unscoped}."

      - name: Upsert HF_TOKEN in Production and Preview
        if: steps.project.outputs.project_id != ''
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.Team_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.huggingfacetoken }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          SCOPE_QS: ${{ steps.project.outputs.scope_qs }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg value "$HF_TOKEN" '{key:"HF_TOKEN",value:$value,type:"encrypted",target:["production","preview"]}')"
          url="https://api.vercel.com/v10/projects/$PROJECT_ID/env?upsert=true"
          if [ -n "$SCOPE_QS" ]; then url="$url&$SCOPE_QS"; fi
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" "$url")"
          echo "HF_TOKEN upsert HTTP $code"
          if [[ "$code" != 2* ]]; then cat "$tmp"; exit 1; fi
          echo 'PASS: HF_TOKEN is configured for Production and Preview.'

      - name: Upsert default HF_MODEL
        if: steps.project.outputs.project_id != ''
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.Team_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          SCOPE_QS: ${{ steps.project.outputs.scope_qs }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg value "$DEFAULT_HF_MODEL" '{key:"HF_MODEL",value:$value,type:"plain",target:["production","preview"]}')"
          url="https://api.vercel.com/v10/projects/$PROJECT_ID/env?upsert=true"
          if [ -n "$SCOPE_QS" ]; then url="$url&$SCOPE_QS"; fi
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" "$url")"
          echo "HF_MODEL upsert HTTP $code"
          if [[ "$code" != 2* ]]; then cat "$tmp"; exit 1; fi
          echo 'PASS: HF_MODEL is configured.'

      - name: Resolve latest Production deployment
        id: previous
        if: steps.project.outputs.project_id != ''
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.Team_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          SCOPE_QS: ${{ steps.project.outputs.scope_qs }}
        run: |
          set -euo pipefail
          url="https://api.vercel.com/v7/deployments?projectId=$PROJECT_ID&target=production&limit=1"
          if [ -n "$SCOPE_QS" ]; then url="$url&$SCOPE_QS"; fi
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "$url")"
          echo "Production deployment lookup HTTP $code"
          if [[ "$code" != 2* ]]; then cat "$tmp"; exit 1; fi
          deployment_id="$(jq -r '(.deployments[0].uid // .deployments[0].id // empty)' "$tmp")"
          if [ -z "$deployment_id" ]; then cat "$tmp"; exit 1; fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "PASS: resolved production deployment $deployment_id."

      - name: Redeploy Production via REST
        id: deploy
        if: steps.previous.outputs.deployment_id != ''
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.Team_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
          SCOPE_QS: ${{ steps.project.outputs.scope_qs }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg name "$VERCEL_PROJECT" --arg project "$PROJECT_ID" --arg deploymentId "$PREVIOUS_DEPLOYMENT_ID" '{name:$name,project:$project,deploymentId:$deploymentId,target:"production"}')"
          url='https://api.vercel.com/v13/deployments?forceNew=1'
          if [ -n "$SCOPE_QS" ]; then url="$url&$SCOPE_QS"; fi
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" "$url")"
          echo "Production redeploy HTTP $code"
          if [[ "$code" != 2* ]]; then cat "$tmp"; exit 1; fi
          deployment_id="$(jq -r '(.id // .uid // empty)' "$tmp")"
          deployment_url="$(jq -r '(.url // empty)' "$tmp")"
          if [ -z "$deployment_id" ] || [ -z "$deployment_url" ]; then cat "$tmp"; exit 1; fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment created: https://$deployment_url"

      - name: Wait for Production deployment
        if: steps.deploy.outputs.deployment_id != ''
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.Team_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          SCOPE_QS: ${{ steps.project.outputs.scope_qs }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            url="https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID"
            if [ -n "$SCOPE_QS" ]; then url="$url?$SCOPE_QS"; fi
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "$url")"
            if [[ "$code" != 2* ]]; then cat "$tmp"; exit 1; fi
            state="$(jq -r '(.readyState // .state // "UNKNOWN")' "$tmp")"
            echo "Deployment state: $state"
            if [ "$state" = READY ]; then exit 0; fi
            if [ "$state" = ERROR ] || [ "$state" = CANCELED ] || [ "$state" = BLOCKED ]; then cat "$tmp"; exit 1; fi
            sleep 5
          done
          echo 'Deployment did not reach READY before timeout.'
          exit 1

      - name: Verify deep AI health
        if: steps.deploy.outputs.deployment_url != ''
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 30 "https://$DEPLOYMENT_URL/api/ai/health?deep=1")"
          echo "$body"
          printf '%s' "$body" | grep -Fq '"mode":"huggingface-provider"'
          printf '%s' "$body" | grep -Fq '"loaded":true'
          echo 'PASS: Hugging Face provider is live on Production.'
