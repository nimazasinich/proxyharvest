name: Sync Hugging Face Provider to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/ai/**'
      - '.github/workflows/sync-vercel-hf.yml'

permissions:
  contents: read

concurrency:
  group: proxyharvest-vercel-hf
  cancel-in-progress: true

jobs:
  sync-vercel-hf:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      VERCEL_PROJECT: proxyharvest
      DEFAULT_HF_MODEL: Qwen/Qwen2.5-7B-Instruct-1M:fastest
    steps:
      - uses: actions/checkout@v4

      - name: Validate AI provider source
        shell: bash
        run: |
          set -euo pipefail
          node --check api/ai/health.js
          node --check api/ai/advise.js
          grep -Fq 'https://router.huggingface.co/v1/chat/completions' api/ai/health.js
          grep -Fq "mode:'huggingface-provider'" api/ai/health.js

      - name: Detect required secrets
        id: creds
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.huggingfacetoken }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${VERCEL_TOKEN:-}" ]; then echo 'VERCEL_TOKEN GitHub Actions secret is missing.'; missing=1; fi
          if [ -z "${HF_TOKEN:-}" ]; then echo 'Hugging Face token GitHub Actions secret is missing.'; missing=1; fi
          if [ "$missing" -eq 0 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Credentials are present; continuing with Vercel REST sync.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Environment sync is blocked until the missing GitHub Actions secret(s) are available.'
          fi

      - name: Verify Vercel REST project access
        id: project
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects?search=$VERCEL_PROJECT")"
          echo "Vercel project lookup HTTP $code"
          if [[ "$code" != 2* ]]; then
            cat "$tmp"
            exit 1
          fi
          project_id="$(jq -r --arg wanted "$VERCEL_PROJECT" '([.projects[]? | select(.name == $wanted)][0] // .projects[0] // {}) | .id // empty' "$tmp")"
          if [ -z "$project_id" ]; then
            echo 'Vercel API returned no matching project.'
            cat "$tmp"
            exit 1
          fi
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "PASS: Vercel REST can access project $VERCEL_PROJECT ($project_id)."

      - name: Upsert HF_TOKEN in Production and Preview
        if: steps.creds.outputs.ready == 'true' && steps.project.outputs.project_id != ''
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.huggingfacetoken }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg value "$HF_TOKEN" '{key:"HF_TOKEN",value:$value,type:"encrypted",target:["production","preview"]}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.vercel.com/v10/projects/$PROJECT_ID/env?upsert=true")"
          echo "HF_TOKEN upsert HTTP $code"
          if [[ "$code" != 2* ]]; then cat "$tmp"; exit 1; fi
          echo 'PASS: HF_TOKEN upserted for production and preview.'

      - name: Ensure default HF_MODEL
        if: steps.creds.outputs.ready == 'true' && steps.project.outputs.project_id != ''
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg value "$DEFAULT_HF_MODEL" '{key:"HF_MODEL",value:$value,type:"plain",target:["production","preview"]}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.vercel.com/v10/projects/$PROJECT_ID/env?upsert=true")"
          echo "HF_MODEL upsert HTTP $code"
          if [[ "$code" != 2* ]]; then cat "$tmp"; exit 1; fi
          echo 'PASS: HF_MODEL configured for production and preview.'

      - name: Resolve latest Production deployment
        id: previous
        if: steps.creds.outputs.ready == 'true' && steps.project.outputs.project_id != ''
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v7/deployments?projectId=$PROJECT_ID&target=production&limit=1")"
          echo "Production deployment lookup HTTP $code"
          if [[ "$code" != 2* ]]; then cat "$tmp"; exit 1; fi
          deployment_id="$(jq -r '(.deployments[0].uid // .deployments[0].id // empty)' "$tmp")"
          if [ -z "$deployment_id" ]; then
            echo 'No production deployment was returned.'
            cat "$tmp"
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "PASS: resolved existing production deployment $deployment_id."

      - name: Redeploy Production via REST
        id: deploy
        if: steps.creds.outputs.ready == 'true' && steps.previous.outputs.deployment_id != ''
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg name "$VERCEL_PROJECT" --arg project "$PROJECT_ID" --arg deploymentId "$PREVIOUS_DEPLOYMENT_ID" '{name:$name,project:$project,deploymentId:$deploymentId,target:"production"}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            'https://api.vercel.com/v13/deployments?forceNew=1')"
          echo "Production redeploy HTTP $code"
          if [[ "$code" != 2* ]]; then cat "$tmp"; exit 1; fi
          deployment_id="$(jq -r '(.id // .uid // empty)' "$tmp")"
          deployment_url="$(jq -r '(.url // empty)' "$tmp")"
          if [ -z "$deployment_id" ] || [ -z "$deployment_url" ]; then
            echo 'Redeploy response lacked deployment id or url.'
            cat "$tmp"
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment created: https://$deployment_url"

      - name: Wait for Production deployment
        if: steps.creds.outputs.ready == 'true' && steps.deploy.outputs.deployment_id != ''
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID")"
            if [[ "$code" != 2* ]]; then cat "$tmp"; exit 1; fi
            state="$(jq -r '(.readyState // .state // "UNKNOWN")' "$tmp")"
            echo "Deployment state: $state"
            if [ "$state" = READY ]; then exit 0; fi
            if [ "$state" = ERROR ] || [ "$state" = CANCELED ] || [ "$state" = BLOCKED ]; then cat "$tmp"; exit 1; fi
            sleep 5
          done
          echo 'Deployment did not reach READY before timeout.'
          exit 1

      - name: Verify deep AI health
        if: steps.creds.outputs.ready == 'true' && steps.deploy.outputs.deployment_url != ''
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 30 "https://$DEPLOYMENT_URL/api/ai/health?deep=1")"
          echo "$body"
          printf '%s' "$body" | grep -Fq '"mode":"huggingface-provider"'
          printf '%s' "$body" | grep -Fq '"loaded":true'
          echo 'PASS: Hugging Face provider is live on the production deployment.'

      - name: Blocker summary
        if: steps.creds.outputs.ready != 'true'
        run: |
          echo 'SKIPPED: expected VERCEL_TOKEN plus HF_TOKEN or configured alias huggingfacetoken.'
