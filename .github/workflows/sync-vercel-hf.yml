name: Sync Hugging Face Provider to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/ai/**'
      - 'scripts/build.mjs'
      - '.github/workflows/sync-vercel-hf.yml'

permissions:
  contents: read

concurrency:
  group: proxyharvest-vercel-hf
  cancel-in-progress: true

jobs:
  sync-vercel-hf:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      VERCEL_PROJECT: proxyharvest
      VERCEL_TEAM_SLUG: dreammakers-projects-6bd02e6d
      VERCEL_TEAM_ID: ${{ secrets.teamid || vars.teamid || 'team_tgCTfev6a9dYgjXVMHGmvtKl' }}
      HF_MODEL: Qwen/Qwen3-4B-Instruct-2507:fastest
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.huggingfacetoken }}
      TEAM_VERCEL_TOKEN: ${{ secrets.Team_VERCEL_TOKEN }}
      PERSONAL_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate exact source and proven HF model
        shell: bash
        run: |
          set -euo pipefail
          node --check api/ai/health.js
          node --check api/ai/advise.js
          grep -Fq 'Qwen/Qwen3-4B-Instruct-2507:fastest' api/ai/health.js
          grep -Fq 'Qwen/Qwen3-4B-Instruct-2507:fastest' api/ai/advise.js
          grep -Fq 'https://router.huggingface.co/v1/chat/completions' api/ai/health.js
          test -n "${HF_TOKEN:-}" || { echo 'HF_TOKEN/huggingfacetoken missing'; exit 2; }
          test -n "${VERCEL_TEAM_ID:-}" || { echo 'teamid missing'; exit 2; }
          if [ -z "${TEAM_VERCEL_TOKEN:-}" ] && [ -z "${PERSONAL_VERCEL_TOKEN:-}" ]; then
            echo 'No configured Vercel credential alias is present.'
            exit 2
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test "$(jq -r '.gitCommit' public/build.json)" = "$GITHUB_SHA"
          echo 'PASS: exact source + Qwen3 provider model validated.'

      - name: Resolve accessible Vercel project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          labels=()
          tokens=()
          if [ -n "${TEAM_VERCEL_TOKEN:-}" ]; then labels+=(Team_VERCEL_TOKEN); tokens+=("$TEAM_VERCEL_TOKEN"); fi
          if [ -n "${PERSONAL_VERCEL_TOKEN:-}" ] && { [ -z "${TEAM_VERCEL_TOKEN:-}" ] || [ "$PERSONAL_VERCEL_TOKEN" != "$TEAM_VERCEL_TOKEN" ]; }; then
            labels+=(VERCEL_TOKEN); tokens+=("$PERSONAL_VERCEL_TOKEN")
          fi

          project_id=''; scope_qs=''; active_token=''; token_label=''
          for i in "${!tokens[@]}"; do
            token="${tokens[$i]}"; label="${labels[$i]}"
            echo "Testing $label"
            team_tmp="$(mktemp)"
            team_code="$(curl -sS -o "$team_tmp" -w '%{http_code}' -H "Authorization: Bearer $token" "https://api.vercel.com/v2/teams?slug=$VERCEL_TEAM_SLUG")"
            echo "$label team lookup HTTP $team_code"
            resolved_team=""
            if [[ "$team_code" == 2* ]]; then resolved_team="$(jq -r '(.teams[0].id // .id // empty)' "$team_tmp")"; fi

            scopes=("teamId=$VERCEL_TEAM_ID")
            if [ -n "$resolved_team" ] && [ "$resolved_team" != "$VERCEL_TEAM_ID" ]; then scopes+=("teamId=$resolved_team"); fi
            scopes+=("slug=$VERCEL_TEAM_SLUG" '')
            for scope in "${scopes[@]}"; do
              url="https://api.vercel.com/v9/projects/$VERCEL_PROJECT"
              label_scope='unscoped'
              if [ -n "$scope" ]; then url="$url?$scope"; label_scope="$scope"; fi
              tmp="$(mktemp)"
              code="$(curl -sS -o "$tmp" -w '%{http_code}' -H "Authorization: Bearer $token" "$url")"
              echo "$label project lookup ($label_scope) HTTP $code"
              if [[ "$code" == 2* ]]; then
                project_id="$(jq -r '.id // empty' "$tmp")"
                if [ -n "$project_id" ]; then scope_qs="$scope"; active_token="$token"; token_label="$label"; break 2; fi
              fi
            done
          done

          if [ -z "$project_id" ]; then
            echo 'BLOCKED: neither configured Vercel credential can access the target team/project.'
            exit 1
          fi
          echo "::add-mask::$active_token"
          echo "VERCEL_ACTIVE_TOKEN=$active_token" >> "$GITHUB_ENV"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "scope_qs=$scope_qs" >> "$GITHUB_OUTPUT"
          echo "PASS: $token_label resolved project $project_id using ${scope_qs:-unscoped}."

      - name: Upsert HF_TOKEN and HF_MODEL
        shell: bash
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          SCOPE_QS: ${{ steps.project.outputs.scope_qs }}
        run: |
          set -euo pipefail
          base="https://api.vercel.com/v10/projects/$PROJECT_ID/env?upsert=true"
          [ -z "$SCOPE_QS" ] || base="$base&$SCOPE_QS"
          for key in HF_TOKEN HF_MODEL; do
            if [ "$key" = HF_TOKEN ]; then value="$HF_TOKEN"; type=encrypted; else value="$HF_MODEL"; type=plain; fi
            payload="$(jq -cn --arg key "$key" --arg value "$value" --arg type "$type" '{key:$key,value:$value,type:$type,target:["production","preview"]}')"
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST -H "Authorization: Bearer $VERCEL_ACTIVE_TOKEN" -H 'Content-Type: application/json' --data "$payload" "$base")"
            echo "$key upsert HTTP $code"
            [[ "$code" == 2* ]] || { cat "$tmp"; exit 1; }
          done
          echo 'PASS: HF_TOKEN and proven Qwen3 HF_MODEL configured.'

      - name: Deploy exact GitHub main commit
        id: deploy
        shell: bash
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          SCOPE_QS: ${{ steps.project.outputs.scope_qs }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg name "$VERCEL_PROJECT" --arg project "$PROJECT_ID" --arg sha "$GITHUB_SHA" '{name:$name,project:$project,target:"production",withLatestCommit:true,gitSource:{type:"github",org:"nimazasinich",repo:"proxyharvest",ref:"main",sha:$sha}}')"
          url='https://api.vercel.com/v13/deployments?forceNew=1'
          [ -z "$SCOPE_QS" ] || url="$url&$SCOPE_QS"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST -H "Authorization: Bearer $VERCEL_ACTIVE_TOKEN" -H 'Content-Type: application/json' --data "$payload" "$url")"
          echo "deployment create HTTP $code"
          [[ "$code" == 2* ]] || { cat "$tmp"; exit 1; }
          id="$(jq -r '(.id // .uid // empty)' "$tmp")"; host="$(jq -r '.url // empty' "$tmp")"
          test -n "$id"; test -n "$host"
          echo "id=$id" >> "$GITHUB_OUTPUT"; echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Wait READY and verify exact build + deep HF
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
          DEPLOYMENT_HOST: ${{ steps.deploy.outputs.host }}
          SCOPE_QS: ${{ steps.project.outputs.scope_qs }}
        run: |
          set -euo pipefail
          for n in $(seq 1 50); do
            url="https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID"; [ -z "$SCOPE_QS" ] || url="$url?$SCOPE_QS"
            tmp="$(mktemp)"; code="$(curl -sS -o "$tmp" -w '%{http_code}' -H "Authorization: Bearer $VERCEL_ACTIVE_TOKEN" "$url")"
            [[ "$code" == 2* ]] || { cat "$tmp"; exit 1; }
            state="$(jq -r '(.readyState // .state // "UNKNOWN")' "$tmp")"; echo "state=$state"
            [ "$state" != READY ] || break
            case "$state" in ERROR|CANCELED|BLOCKED) cat "$tmp"; exit 1;; esac
            [ "$n" -lt 50 ] || { echo 'Deployment READY timeout'; exit 1; }
            sleep 5
          done
          build="$(curl -fsS --max-time 30 "https://$DEPLOYMENT_HOST/build.json")"
          test "$(printf '%s' "$build" | jq -r '.gitCommit')" = "$GITHUB_SHA"
          ai="$(curl -fsS --max-time 45 "https://$DEPLOYMENT_HOST/api/ai/health?deep=1")"
          echo "$ai"
          printf '%s' "$ai" | grep -Fq '"mode":"huggingface-provider"'
          printf '%s' "$ai" | grep -Fq '"loaded":true'
          printf '%s' "$ai" | grep -Fq 'Qwen/Qwen3-4B-Instruct-2507:fastest'
          echo 'PASS: exact Vercel production build + Hugging Face provider.'
